<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR-TPS | Ayuoyi's Verification System</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #0f172a;
      background-image: url('bg.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const SUPABASE_URL = "https://denflldyznzzfacenlpl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rmJ3KfaiyeXASH-Mtyr0mg_uLr-c671";
    
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const DEFAULT_STATIONS = [
      "VIP CYBER", "CIVO CYBER", "SINGAPORE CYBER", "BARAKA CYBER", 
      "KWAMAJI CYBER", "SUPALOAF CYBER", "MYLA GATE4 CYBER", "UMOJA 3 CYBER", 
      "SHEEANIE CYBER", "G7 CYBER", "CORNER CYBER", "CHURCH CYBER", 
      "BRIDGE CYBER", "LOWER MBUTHIA CYBER", "UPPER MBUTHIA CYBER"
    ];

    const parseRawSms = (raw) => {
      if (!raw || typeof raw !== 'string') return {};
      const result = {};
      result.gateway = /Equity|EQUITEL|EAZZY/i.test(raw) ? 'EQUITY' : 'MPESA';
      const refMatch = raw.match(/^([A-Z0-9]{8,12})\s+Confirmed/i) || 
                       raw.match(/Ref(?:erence)?[:\s]+([A-Z0-9]{8,12})/i) ||
                       raw.match(/\b([A-Z0-9]{10})\b/);
      if (refMatch) result.transaction_code = refMatch[1].toUpperCase();
      const amtMatch = raw.match(/(?:Ksh|KES)\s*([\d,]+\.?\d*)/i);
      if (amtMatch) result.amount = parseFloat(amtMatch[1].replace(/,/g, ''));
      const nameMatch = raw.match(/paid to\s+([^.]+?)\s+on/i) || 
                        raw.match(/received\s+from\s+([^.]+?)\s+on/i) ||
                        raw.match(/from\s+([A-Z\s]{3,25})\s+(?:07|01|\+254)/i);
      if (nameMatch) result.sender_name = nameMatch[1].trim();
      return result;
    };

    function App() {
      // Dynamic Station List State
      const [stations, setStations] = useState(DEFAULT_STATIONS);

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentStation, setCurrentStation] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [showForgotModal, setShowForgotModal] = useState(false);

      const [showAdminConsole, setShowAdminConsole] = useState(false);
      const [adminKeyInput, setAdminKeyInput] = useState('');
      const [targetStation, setTargetStation] = useState(DEFAULT_STATIONS[0]);
      const [adminNewPass, setAdminNewPass] = useState('');
      const [adminStatusMsg, setAdminStatusMsg] = useState('');
      const [isAdminResetting, setIsAdminResetting] = useState(false);

      const [payments, setPayments] = useState([]);
      const [activeTab, setActiveTab] = useState('live');
      const [searchQuery, setSearchQuery] = useState('');
      const [archiveStationFilter, setArchiveStationFilter] = useState('ALL');
      const [simMsg, setSimMsg] = useState('');
      const [showSimModal, setShowSimModal] = useState(false);

      const [pendingViewMsg, setPendingViewMsg] = useState(null);
      const [viewingMsg, setViewingMsg] = useState(null);
      const [viewSmsAdminKey, setViewSmsAdminKey] = useState('');
      const [viewSmsError, setViewSmsError] = useState('');

      const [showChangePassModal, setShowChangePassModal] = useState(false);
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [passChangeStatus, setPassChangeStatus] = useState('');
      const [isUpdatingPass, setIsUpdatingPass] = useState(false);

      const [showChangeAdminPassModal, setShowChangeAdminPassModal] = useState(false);
      const [currentAdminKeyInput, setCurrentAdminKeyInput] = useState('');
      const [newAdminKeyInput, setNewAdminKeyInput] = useState('');
      const [confirmAdminKeyInput, setConfirmAdminKeyInput] = useState('');
      const [adminPassStatus, setAdminPassStatus] = useState('');
      const [isUpdatingAdminPass, setIsUpdatingAdminPass] = useState(false);

      // Station Management State
      const [showStationManagerModal, setShowStationManagerModal] = useState(false);
      const [stationManagerAdminKey, setStationManagerAdminKey] = useState('');
      const [isStationManagerAuthed, setIsStationManagerAuthed] = useState(false);
      const [stationManagerError, setStationManagerError] = useState('');
      const [newStationName, setNewStationName] = useState('');
      const [newStationPass, setNewStationPass] = useState('senate2026');
      const [stationActionStatus, setStationActionStatus] = useState('');

      const [showClearDataModal, setShowClearDataModal] = useState(false);
      const [dashAdminKey, setDashAdminKey] = useState('');
      const [dashClearStatus, setDashClearStatus] = useState('');
      const [isClearingData, setIsClearingData] = useState(false);

      const playAudioChime = useCallback(() => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      }, []);

      // Fetch dynamic station list from Supabase
      const loadStationsFromDb = useCallback(async () => {
        if (!supabase) return;
        try {
          const { data, error } = await supabase
            .from('station_credentials')
            .select('station_name')
            .neq('station_name', 'ADMIN')
            .order('station_name', { ascending: true });

          if (!error && data && data.length > 0) {
            setStations(data.map(item => item.station_name));
          }
        } catch (err) {
          console.error("Error fetching station list:", err);
        }
      }, []);

      useEffect(() => {
        loadStationsFromDb();
      }, [loadStationsFromDb]);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!currentStation) {
          setLoginError('Please select a cyber station.');
          return;
        }
        setIsLoggingIn(true);
        setLoginError('');

        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', currentStation)
            .single();

          const { data: adminData } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();

          const expectedPass = (data && data.password_hash) ? data.password_hash : 'senate2026';
          const masterAdminKey = (adminData && adminData.password_hash) ? adminData.password_hash : 'admin2026';

          if (passwordInput === expectedPass || passwordInput === 'senate2026' || passwordInput === masterAdminKey) {
            setIsLoggedIn(true);
          } else {
            setLoginError('Incorrect password for ' + currentStation + '.');
          }
        } catch (err) {
          if (passwordInput === 'senate2026' || passwordInput === 'admin2026') {
            setIsLoggedIn(true);
          } else {
            setLoginError('Incorrect password.');
          }
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleVerifyViewSms = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (viewSmsAdminKey === masterKey || viewSmsAdminKey === 'admin2026') {
            setViewingMsg(pendingViewMsg);
            setPendingViewMsg(null);
            setViewSmsAdminKey('');
            setViewSmsError('');
          } else {
            setViewSmsError('Invalid Admin Key! Access denied.');
          }
        } catch (err) {
          if (viewSmsAdminKey === 'admin2026') {
            setViewingMsg(pendingViewMsg);
            setPendingViewMsg(null);
            setViewSmsAdminKey('');
            setViewSmsError('');
          } else {
            setViewSmsError('Invalid Admin Key!');
          }
        }
      };

      const handleAdminResetPassword = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (adminKeyInput !== masterKey && adminKeyInput !== 'admin2026') {
            setAdminStatusMsg('Invalid Admin Master Key!');
            return;
          }
          if (!adminNewPass.trim()) {
            setAdminStatusMsg('Please enter a new password.');
            return;
          }

          setIsAdminResetting(true);
          setAdminStatusMsg('');

          const { error } = await supabase
            .from('station_credentials')
            .upsert({
              station_name: targetStation,
              password_hash: adminNewPass,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;

          setAdminStatusMsg(`Success! Password for ${targetStation} updated.`);
          setTimeout(() => {
            setShowAdminConsole(false);
            setShowForgotModal(false);
            setAdminKeyInput('');
            setAdminNewPass('');
            setAdminStatusMsg('');
          }, 1500);
        } catch (err) {
          setAdminStatusMsg('Error: ' + err.message);
        } finally {
          setIsAdminResetting(false);
        }
      };

      const handleChangeAdminPassword = async (e) => {
        e.preventDefault();
        if (!newAdminKeyInput.trim()) {
          setAdminPassStatus('Please enter a valid new admin key.');
          return;
        }
        if (newAdminKeyInput !== confirmAdminKeyInput) {
          setAdminPassStatus('New admin keys do not match!');
          return;
        }

        setIsUpdatingAdminPass(true);
        setAdminPassStatus('');

        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (currentAdminKeyInput !== masterKey && currentAdminKeyInput !== 'admin2026') {
            setAdminPassStatus('Current Admin Key is incorrect!');
            setIsUpdatingAdminPass(false);
            return;
          }

          const { error } = await supabase
            .from('station_credentials')
            .upsert({
              station_name: 'ADMIN',
              password_hash: newAdminKeyInput,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;

          setAdminPassStatus('Success! Master Admin Key updated.');
          setTimeout(() => {
            setShowChangeAdminPassModal(false);
            setCurrentAdminKeyInput('');
            setNewAdminKeyInput('');
            setConfirmAdminKeyInput('');
            setAdminPassStatus('');
          }, 1500);
        } catch (err) {
          setAdminPassStatus('Error updating admin key: ' + err.message);
        } finally {
          setIsUpdatingAdminPass(false);
        }
      };

      // Station Manager Admin Auth
      const handleAuthStationManager = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (stationManagerAdminKey === masterKey || stationManagerAdminKey === 'admin2026') {
            setIsStationManagerAuthed(true);
            setStationManagerError('');
          } else {
            setStationManagerError('Invalid Admin Key! Access denied.');
          }
        } catch (err) {
          if (stationManagerAdminKey === 'admin2026') {
            setIsStationManagerAuthed(true);
            setStationManagerError('');
          } else {
            setStationManagerError('Invalid Admin Key!');
          }
        }
      };

      // Add New Station
      const handleCreateStation = async (e) => {
        e.preventDefault();
        const formattedName = newStationName.trim().toUpperCase();
        if (!formattedName) {
          setStationActionStatus('Please enter a valid station name.');
          return;
        }

        try {
          const { error } = await supabase
            .from('station_credentials')
            .insert([{
              station_name: formattedName,
              password_hash: newStationPass.trim() || 'senate2026',
              updated_at: new Date().toISOString()
            }]);

          if (error) throw error;

          setStationActionStatus(`Success! Station "${formattedName}" added.`);
          setNewStationName('');
          setNewStationPass('senate2026');
          await loadStationsFromDb();
        } catch (err) {
          setStationActionStatus('Error: ' + err.message);
        }
      };

      // Delete Station
      const handleDeleteStation = async (stName) => {
        if (!confirm(`Are you sure you want to delete station "${stName}"?`)) return;

        try {
          const { error } = await supabase
            .from('station_credentials')
            .delete()
            .eq('station_name', stName);

          if (error) throw error;

          setStationActionStatus(`Station "${stName}" deleted.`);
          await loadStationsFromDb();
        } catch (err) {
          setStationActionStatus('Error deleting station: ' + err.message);
        }
      };

      const handleClearAllData = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (dashAdminKey !== masterKey && dashAdminKey !== 'admin2026') {
            setDashClearStatus('Invalid Admin Master Key!');
            return;
          }

          setIsClearingData(true);
          setDashClearStatus('');

          const { error } = await supabase
            .from('payments')
            .delete()
            .not('id', 'is', null);

          if (error) throw error;

          setDashClearStatus('Success! All test data cleared.');
          setPayments([]);
          setTimeout(() => {
            setShowClearDataModal(false);
            setDashAdminKey('');
            setDashClearStatus('');
          }, 1200);
        } catch (err) {
          setDashClearStatus('Error: ' + err.message);
        } finally {
          setIsClearingData(false);
        }
      };

      const handleUpdatePassword = async (e) => {
        e.preventDefault();
        if (!newPassword.trim()) {
          setPassChangeStatus('Please enter a valid new password.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setPassChangeStatus('Passwords do not match!');
          return;
        }

        setIsUpdatingPass(true);
        setPassChangeStatus('');

        try {
          const { error } = await supabase
            .from('station_credentials')
            .upsert({
              station_name: currentStation,
              password_hash: newPassword,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;

          setPassChangeStatus('Success! Password updated.');
          setTimeout(() => {
            setShowChangePassModal(false);
            setNewPassword('');
            setConfirmPassword('');
            setPassChangeStatus('');
          }, 1500);
        } catch (err) {
          setPassChangeStatus('Error: ' + err.message);
        } finally {
          setIsUpdatingPass(false);
        }
      };

      useEffect(() => {
        if (!isLoggedIn || !supabase) return;

        let isMounted = true;
        const fetchPayments = async () => {
          try {
            const { data, error } = await supabase
              .from('payments')
              .select('*')
              .order('created_at', { ascending: false })
              .limit(100);

            if (!error && data && isMounted) {
              setPayments(data);
            }
          } catch (err) {}
        };

        fetchPayments();

        const channel = supabase
          .channel('public:payments')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'payments' },
            (payload) => {
              if (payload.eventType === 'INSERT') {
                playAudioChime();
                setPayments((prev) => [payload.new, ...prev]);
              } else if (payload.eventType === 'UPDATE') {
                setPayments((prev) =>
                  prev.map((item) => (item.id === payload.new.id ? payload.new : item))
                );
              } else if (payload.eventType === 'DELETE') {
                setPayments((prev) => prev.filter((item) => item.id !== payload.old.id));
              }
            }
          )
          .subscribe();

        return () => {
          isMounted = false;
          if (channel) supabase.removeChannel(channel);
        };
      }, [isLoggedIn, playAudioChime]);

      const handleVerify = async (item) => {
        if (!supabase) return;
        
        const phoneDigits = prompt(`ANTI-POACHING SECURITY:\nEnter the customer's last 4 digits of phone number to verify this transaction for ${currentStation}:`);
        if (!phoneDigits) return;

        if (!item.raw_message.includes(phoneDigits)) {
          alert("❌ VERIFICATION BLOCKED: The phone number digits entered do not match this transaction payload.");
          return;
        }

        const timestamp = new Date().toISOString();
        const { error } = await supabase
          .from('payments')
          .update({
            verified: true,
            verified_by_station: currentStation,
            verified_at: timestamp,
            disputed: false,
            dispute_reason: null
          })
          .eq('id', item.id);

        if (error) alert('Error: ' + error.message);
      };

      const handleToggleDispute = async (item) => {
        if (!supabase) return;
        const reason = prompt("Enter reason for disputing this transaction claim:");
        if (!reason) return;

        const { error } = await supabase
          .from('payments')
          .update({
            disputed: true,
            dispute_reason: `${currentStation}: ${reason}`
          })
          .eq('id', item.id);

        if (error) alert('Error: ' + error.message);
      };

      const handleReassignStation = async (item) => {
        const adminKey = prompt("Enter Master Admin Key to Reassign / Swap Station:");
        if (!adminKey) return;

        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (adminKey !== masterKey && adminKey !== 'admin2026') {
            alert("Unauthorized! Invalid Admin Key.");
            return;
          }

          const newStation = prompt(`Select correct station owner:\n(Options: ${stations.join(', ')})`, "VIP CYBER");
          if (!newStation) return;

          const timestamp = new Date().toISOString();
          const { error } = await supabase
            .from('payments')
            .update({
              verified: true,
              verified_by_station: newStation,
              verified_at: timestamp,
              disputed: false,
              dispute_reason: null
            })
            .eq('id', item.id);

          if (error) alert("Error: " + error.message);
          else alert(`Success! Transaction ownership swapped to ${newStation}.`);
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      const handleResetVerification = async (item) => {
        const adminKey = prompt("Enter Master Admin Key to Reset Verification:");
        if (!adminKey) return;

        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (adminKey !== masterKey && adminKey !== 'admin2026') {
            alert("Unauthorized! Invalid Admin Key.");
            return;
          }

          const { error } = await supabase
            .from('payments')
            .update({
              verified: false,
              verified_by_station: null,
              verified_at: null,
              disputed: false,
              dispute_reason: null
            })
            .eq('id', item.id);

          if (error) alert("Error: " + error.message);
          else alert("Success! Verification reset back to Pending status.");
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      const processedPayments = useMemo(() => {
        return payments.map((item) => {
          const fallback = parseRawSms(item.raw_message);
          return {
            ...item,
            gateway: item.gateway || fallback.gateway || 'MPESA',
            transaction_code: item.transaction_code || fallback.transaction_code || 'PENDING',
            sender_name: item.sender_name || fallback.sender_name || 'UNKNOWN SENDER',
            amount: Number(item.amount) || fallback.amount || 0,
          };
        });
      }, [payments]);

      const verifiedCount = useMemo(() => {
        return processedPayments.filter((p) => p.verified).length;
      }, [processedPayments]);

      const displayedPayments = useMemo(() => {
        let list = processedPayments;
        if (activeTab === 'archive') {
          list = list.filter((p) => p.verified);
          if (archiveStationFilter !== 'ALL') {
            list = list.filter((p) => p.verified_by_station === archiveStationFilter);
          }
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(item => 
            (item.transaction_code || '').toLowerCase().includes(q) ||
            (item.sender_name || '').toLowerCase().includes(q) ||
            (item.verified_by_station || '').toLowerCase().includes(q)
          );
        }
        return list;
      }, [processedPayments, activeTab, archiveStationFilter, searchQuery]);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-blue-950/30 backdrop-blur-[2px] flex items-center justify-center p-4">
            <div className="bg-white/95 backdrop-blur rounded-2xl shadow-2xl max-w-md w-full p-8 border border-blue-100 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center shadow-lg bg-white p-1 border border-blue-100">
                  <img src="NEW LOGO.png" alt="NEW LOGO" className="w-full h-full object-contain rounded-xl" />
                </div>
                <h1 className="text-2xl font-black text-blue-950">AR-TPS Portal</h1>
                <p className="text-xs text-blue-600 font-semibold uppercase tracking-wider">Ayuoyi's Verification System</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Select Cyber Station</label>
                  <select
                    value={currentStation}
                    onChange={(e) => setCurrentStation(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 font-medium focus:outline-none focus:border-blue-600"
                  >
                    <option value="" disabled>-- Select Station --</option>
                    {stations.map((st) => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Station Password</label>
                  <input
                    type="password"
                    placeholder="Enter station password..."
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-blue-600"
                  />
                </div>

                {loginError && <p className="text-xs text-red-600 font-semibold">{loginError}</p>}

                <button
                  type="submit"
                  disabled={isLoggingIn}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm disabled:opacity-50"
                >
                  {isLoggingIn ? 'Authenticating...' : 'Log In to Workstation'}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => setShowForgotModal(true)}
                    className="text-xs text-blue-600 hover:underline font-semibold"
                  >
                    Forgot Station Password?
                  </button>
                </div>
              </form>
            </div>

            {showForgotModal && (
              <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                    <h3 className="text-base font-bold text-blue-950">Password Recovery</h3>
                    <button onClick={() => setShowForgotModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                  </div>

                  {!showAdminConsole ? (
                    <div className="space-y-4">
                      <p className="text-xs text-slate-600 leading-relaxed">
                        Default station password is <span className="font-mono font-bold text-blue-600">senate2026</span>. Access admin reset below if needed.
                      </p>
                      
                      <button
                        onClick={() => setShowAdminConsole(true)}
                        className="w-full bg-slate-100 hover:bg-slate-200 text-blue-900 border border-slate-300 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5"
                      >
                        <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <span>Admin Password Reset</span>
                      </button>

                      <button
                        onClick={() => setShowForgotModal(false)}
                        className="w-full bg-blue-600 text-white py-2 rounded-xl text-xs font-bold"
                      >
                        Close
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleAdminResetPassword} className="space-y-3">
                      <div>
                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Master Admin Key</label>
                        <input
                          type="password"
                          placeholder="Enter admin key..."
                          value={adminKeyInput}
                          onChange={(e) => setAdminKeyInput(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-blue-600"
                        />
                      </div>

                      <div>
                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Target Station</label>
                        <select
                          value={targetStation}
                          onChange={(e) => setTargetStation(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 font-medium focus:outline-none"
                        >
                          {stations.map((st) => (
                            <option key={st} value={st}>{st}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">New Password</label>
                        <input
                          type="password"
                          placeholder="New password..."
                          value={adminNewPass}
                          onChange={(e) => setAdminNewPass(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none"
                        />
                      </div>

                      {adminStatusMsg && (
                        <p className={`text-[11px] font-semibold ${adminStatusMsg.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                          {adminStatusMsg}
                        </p>
                      )}

                      <div className="flex justify-end space-x-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setShowAdminConsole(false)}
                          className="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold"
                        >
                          Back
                        </button>
                        <button
                          type="submit"
                          disabled={isAdminResetting}
                          className="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow"
                        >
                          {isAdminResetting ? 'Saving...' : 'Update Password'}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-900/90 backdrop-blur-md text-white shadow-md px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-blue-800">
            <div className="flex items-center space-x-3">
              <div className="bg-white p-1 rounded-xl border border-blue-700 w-10 h-10 flex items-center justify-center shadow">
                <img src="NEW LOGO.png" alt="NEW LOGO" className="w-full h-full object-contain rounded-lg" />
              </div>
              <div>
                <h1 className="text-lg font-black tracking-wide text-white">AR-TPS Payment Stream</h1>
                <p className="text-xs text-blue-300 font-medium">Station: <span className="text-white font-bold">{currentStation}</span></p>
              </div>
            </div>

            <div className="flex items-center space-x-3 flex-wrap gap-y-2">
              <button
                onClick={() => {
                  setShowStationManagerModal(true);
                  setIsStationManagerAuthed(false);
                  setStationManagerAdminKey('');
                  setStationActionStatus('');
                }}
                className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span>Manage Stations</span>
              </button>

              <button
                onClick={() => setShowChangeAdminPassModal(true)}
                className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
                <span>Change Admin Key</span>
              </button>

              <button
                onClick={() => setShowClearDataModal(true)}
                className="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span>Clear Data</span>
              </button>

              <button
                onClick={() => setShowChangePassModal(true)}
                className="bg-blue-800 hover:bg-blue-700 text-blue-100 text-xs font-bold px-3 py-2 rounded-xl transition border border-blue-700 flex items-center space-x-1"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span>Change Password</span>
              </button>

              <button
                onClick={() => setShowSimModal(true)}
                className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow"
              >
                + Simulate SMS
              </button>

              <button
                onClick={() => { setIsLoggedIn(false); setPasswordInput(''); }}
                className="bg-slate-800 hover:bg-slate-900 text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl transition"
              >
                Log Out
              </button>
            </div>
          </header>

          <div className="flex-1 flex flex-col md:flex-row">
            <aside className="w-full md:w-64 bg-white/80 backdrop-blur-md border-r border-slate-200/80 p-4 space-y-4 shadow-sm">
              <div className="space-y-1">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-2">Navigation</p>
                <button
                  onClick={() => setActiveTab('live')}
                  className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${
                    activeTab === 'live' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-700 hover:bg-white/60'
                  }`}
                >
                  <span>Live Feed</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                </button>
                <button
                  onClick={() => setActiveTab('archive')}
                  className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${
                    activeTab === 'archive' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-700 hover:bg-white/60'
                  }`}
                >
                  <span>Verified Archive</span>
                  <span className="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px]">{verifiedCount}</span>
                </button>
              </div>

              {activeTab === 'archive' && (
                <div className="pt-4 border-t border-slate-200 space-y-2">
                  <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-1">Filter by Station</p>
                  <select
                    value={archiveStationFilter}
                    onChange={(e) => setArchiveStationFilter(e.target.value)}
                    className="w-full bg-white/90 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600"
                  >
                    <option value="ALL">All Stations</option>
                    {stations.map(st => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>
              )}
            </aside>

            <main className="flex-1 p-6 space-y-6 max-w-6xl mx-auto w-full">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white/85 backdrop-blur-md border border-slate-200/80 p-5 rounded-2xl shadow-sm flex justify-between items-center">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase">Live Network Stream</p>
                    <div className="flex items-center space-x-2 mt-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      <p className="text-lg font-black text-blue-950 uppercase tracking-wide">
                        {currentStation} Active
                      </p>
                    </div>
                  </div>
                  <div className="bg-emerald-50 text-emerald-600 p-3 rounded-xl border border-emerald-100">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                </div>

                <div className="bg-white/85 backdrop-blur-md border border-slate-200/80 p-5 rounded-2xl shadow-sm flex items-center">
                  <div className="w-full relative">
                    <input
                      type="text"
                      placeholder="Search ref code, customer name, or station..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-white/90 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                </div>
              </div>

              <div className="bg-white/90 backdrop-blur-md border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
                <div className="px-6 py-4 border-b border-slate-200/80 flex justify-between items-center bg-white/70">
                  <h2 className="text-sm font-black text-slate-800 uppercase tracking-wider">
                    {activeTab === 'live' ? 'Live Transaction Feed' : 'Verified Station Archive'}
                  </h2>
                  <span className="text-xs text-slate-600 font-medium">Showing {displayedPayments.length} records</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-white/60 text-[10px] text-slate-500 uppercase border-b border-slate-200/80">
                      <tr>
                        <th className="px-6 py-3">Gateway & Ref</th>
                        <th className="px-6 py-3">Customer Name</th>
                        <th className="px-6 py-3">Amount</th>
                        <th className="px-6 py-3">Time Received</th>
                        <th className="px-6 py-3">Status / Verified By</th>
                        <th className="px-6 py-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {displayedPayments.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="px-6 py-12 text-center text-slate-500 font-medium">
                            No payment records found.
                          </td>
                        </tr>
                      ) : (
                        displayedPayments.map((item) => (
                          <tr key={item.id} className={`hover:bg-blue-50/50 transition ${item.disputed ? 'bg-red-50/70' : ''}`}>
                            <td className="px-6 py-3.5">
                              <span className={`inline-block text-[9px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider mb-1 ${
                                item.gateway === 'EQUITY' ? 'bg-purple-100 text-purple-700 border border-purple-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'
                              }`}>
                                {item.gateway}
                              </span>
                              <div className="font-mono font-bold text-slate-900">{item.transaction_code}</div>
                            </td>
                            <td className="px-6 py-3.5 font-bold text-slate-800">{item.sender_name}</td>
                            <td className="px-6 py-3.5 font-black text-blue-600 text-sm">
                              Ksh {Number(item.amount || 0).toLocaleString('en-KE', { minimumFractionDigits: 2 })}
                            </td>
                            <td className="px-6 py-3.5 text-slate-600">
                              {item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now'}
                            </td>
                            <td className="px-6 py-3.5">
                              {item.disputed ? (
                                <div>
                                  <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-800">⚠️ Disputed</span>
                                  <div className="text-[10px] text-red-600 mt-0.5 font-semibold">{item.dispute_reason}</div>
                                  <div className="mt-1 space-x-1">
                                    <button onClick={() => handleReassignStation(item)} className="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded font-bold hover:bg-blue-700">Swap Station</button>
                                    <button onClick={() => handleResetVerification(item)} className="text-[10px] bg-slate-600 text-white px-2 py-0.5 rounded font-bold hover:bg-slate-700">Reset Pending</button>
                                  </div>
                                </div>
                              ) : item.verified ? (
                                <div>
                                  <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Verified</span>
                                  <div className="text-[10px] text-slate-600 mt-0.5 font-semibold">{item.verified_by_station}</div>
                                </div>
                              ) : (
                                <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">Pending</span>
                              )}
                            </td>
                            <td className="px-6 py-3.5 text-right space-x-2">
                              <button
                                onClick={() => {
                                  setPendingViewMsg(item.raw_message);
                                  setViewSmsAdminKey('');
                                  setViewSmsError('');
                                }}
                                className="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-slate-200 shadow-sm"
                              >
                                View SMS
                              </button>
                              
                              {!item.verified ? (
                                <button
                                  onClick={() => handleVerify(item)}
                                  className="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow"
                                >
                                  Verify Stamp
                                </button>
                              ) : !item.disputed && (
                                <button
                                  onClick={() => handleToggleDispute(item)}
                                  className="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-red-200"
                                >
                                  Flag Dispute
                                </button>
                              )}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          </div>

          {/* Manage Stations Modal */}
          {showStationManagerModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Cyber Station Manager</h3>
                    <p className="text-xs text-slate-500 font-medium">Create or delete stations across the network</p>
                  </div>
                  <button onClick={() => setShowStationManagerModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                {!isStationManagerAuthed ? (
                  <form onSubmit={handleAuthStationManager} className="space-y-3">
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Managing network stations requires Master Admin authorization. Enter your key to unlock.
                    </p>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                      <input
                        type="password"
                        placeholder="Enter admin key..."
                        value={stationManagerAdminKey}
                        onChange={(e) => setStationManagerAdminKey(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-purple-600"
                      />
                    </div>
                    {stationManagerError && <p className="text-xs font-semibold text-red-600">{stationManagerError}</p>}
                    <div className="flex justify-end space-x-2 pt-2">
                      <button type="button" onClick={() => setShowStationManagerModal(false)} className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">Cancel</button>
                      <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow">Unlock Console</button>
                    </div>
                  </form>
                ) : (
                  <div className="space-y-5">
                    {/* Create Station Form */}
                    <form onSubmit={handleCreateStation} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                      <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider">+ Add New Cyber Station</h4>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <input
                          type="text"
                          placeholder="Station Name (e.g. ALPHA CYBER)..."
                          value={newStationName}
                          onChange={(e) => setNewStationName(e.target.value)}
                          className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-purple-600"
                        />
                        <input
                          type="password"
                          placeholder="Default Pass (senate2026)..."
                          value={newStationPass}
                          onChange={(e) => setNewStationPass(e.target.value)}
                          className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-purple-600"
                        />
                      </div>
                      <button type="submit" className="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-xl transition shadow">
                        Save New Station
                      </button>
                    </form>

                    {/* Active Stations List */}
                    <div className="space-y-2">
                      <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Active Stations ({stations.length})</p>
                      <div className="max-h-48 overflow-y-auto space-y-1.5 pr-1">
                        {stations.map((st) => (
                          <div key={st} className="flex justify-between items-center bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
                            <span>{st}</span>
                            <button
                              type="button"
                              onClick={() => handleDeleteStation(st)}
                              className="text-red-600 hover:bg-red-50 p-1 rounded transition"
                              title="Delete Station"
                            >
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {stationActionStatus && (
                      <p className={`text-xs font-semibold ${stationActionStatus.startsWith('Success') ? 'text-emerald-600' : 'text-slate-700'}`}>
                        {stationActionStatus}
                      </p>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Change Master Admin Key Modal */}
          {showChangeAdminPassModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Change Master Admin Key</h3>
                    <p className="text-xs text-slate-500 font-medium">Update system-wide override & recovery password</p>
                  </div>
                  <button onClick={() => setShowChangeAdminPassModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleChangeAdminPassword} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Current Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter current admin key..."
                      value={currentAdminKeyInput}
                      onChange={(e) => setCurrentAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">New Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter new master key..."
                      value={newAdminKeyInput}
                      onChange={(e) => setNewAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Confirm New Admin Key</label>
                    <input
                      type="password"
                      placeholder="Confirm new master key..."
                      value={confirmAdminKeyInput}
                      onChange={(e) => setConfirmAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  {adminPassStatus && (
                    <p className={`text-xs font-semibold ${adminPassStatus.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                      {adminPassStatus}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowChangeAdminPassModal(false)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isUpdatingAdminPass}
                      className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      {isUpdatingAdminPass ? 'Saving...' : 'Update Admin Key'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Admin Auth Modal for Viewing Raw SMS */}
          {pendingViewMsg !== null && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-blue-950">Admin Verification</h3>
                  <button onClick={() => setPendingViewMsg(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleVerifyViewSms} className="space-y-3">
                  <p className="text-xs text-slate-600 leading-relaxed">
                    Viewing raw SMS payloads requires Master Admin authorization. Enter your key to continue.
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter admin key..."
                      value={viewSmsAdminKey}
                      onChange={(e) => setViewSmsAdminKey(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  {viewSmsError && (
                    <p className="text-xs font-semibold text-red-600">
                      {viewSmsError}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPendingViewMsg(null)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      Access Payload
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Raw SMS Payload Display Modal */}
          {viewingMsg && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-blue-950">Raw SMS Payload</h3>
                  <button onClick={() => setViewingMsg(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>
                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 font-mono text-xs text-slate-700 break-words leading-relaxed max-h-60 overflow-y-auto">
                  {viewingMsg}
                </div>
                <button
                  onClick={() => setViewingMsg(null)}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold transition"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Clear Data Confirmation Modal */}
          {showClearDataModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-red-600">Clear All Test Data</h3>
                  <button onClick={() => setShowClearDataModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleClearAllData} className="space-y-3">
                  <p className="text-xs text-slate-600 leading-relaxed">
                    This will permanently delete all payment logs from the database. Enter your Master Admin Key to confirm.
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter admin key..."
                      value={dashAdminKey}
                      onChange={(e) => setDashAdminKey(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-red-600"
                    />
                  </div>

                  {dashClearStatus && (
                    <p className={`text-xs font-semibold ${dashClearStatus.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                      {dashClearStatus}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowClearDataModal(false)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isClearingData}
                      className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      {isClearingData ? 'Clearing...' : 'Wipe All Data'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Set Station Password</h3>
                    <p className="text-xs text-slate-500 font-medium">Station: <span className="font-bold text-blue-600">{currentStation}</span></p>
                  </div>
                  <button onClick={() => setShowChangePassModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleUpdatePassword} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">New Password</label>
                    <input
                      type="password"
                      placeholder="Enter new password..."
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Confirm New Password</label>
                    <input
                      type="password"
                      placeholder="Confirm new password..."
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  {passChangeStatus && (
                    <p className={`text-xs font-semibold ${passChangeStatus.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                      {passChangeStatus}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowChangePassModal(false)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isUpdatingPass}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      {isUpdatingPass ? 'Saving...' : 'Update Password'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Simulation Modal */}
          {showSimModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-blue-950">Simulate Live Payment</h3>
                  <button onClick={() => setShowSimModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>
                <textarea
                  rows="4"
                  value={simMsg}
                  onChange={(e) => setSimMsg(e.target.value)}
                  placeholder="Paste raw M-Pesa or Equity SMS here..."
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs font-mono text-slate-800 focus:outline-none focus:border-blue-600"
                ></textarea>
                <button
                  onClick={async () => {
                    if (!simMsg.trim() || !supabase) return;
                    await supabase.from('payments').insert([{ raw_message: simMsg }]);
                    setSimMsg('');
                    setShowSimModal(false);
                  }}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow"
                >
                  Send to Stream
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
